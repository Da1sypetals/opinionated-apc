<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeBess</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="tt"></div>

<div class="plugin">

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">DEBESS</div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- DISPLAY PANEL -->
    <div class="display-panel">
      <div class="display-tabs">
        <button class="display-tab active" data-view="spectrum">SPECTRUM</button>
        <button class="display-tab inactive" data-view="gr">GR TIMELINE</button>

        <div class="display-legend" id="legend-spectrum">
          <div class="legend-item">
            <div class="legend-swatch" style="background: rgba(120,170,200,0.55);"></div>
            <span class="legend-text">INPUT</span>
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background: #5ac8e0;"></div>
            <span class="legend-text accent">OUTPUT</span>
          </div>
          <div class="legend-item">
            <div class="legend-swatch fill-type" style="background: #e8445a;"></div>
            <span class="legend-text red">REDUCTION</span>
          </div>
        </div>

        <div class="display-legend" id="legend-gr" style="display:none;">
          <div class="legend-item">
            <div class="legend-swatch" style="background: #e8445a;"></div>
            <span class="legend-text red">GR</span>
          </div>
          <div class="legend-item">
            <div class="legend-swatch fill-type" style="background: rgba(70,120,150,0.4);"></div>
            <span class="legend-text">WAVE</span>
          </div>
        </div>
      </div>

      <div class="display-area">
        <canvas id="spectrumCanvas"></canvas>
        <canvas id="grCanvas" style="display:none;"></canvas>
      </div>
    </div>

    <!-- CONTROLS ROW -->
    <div class="controls-row">

      <!-- KNOBS -->
      <div class="knobs-section">
        <div class="knob-col">
          <canvas class="kc" data-p="intensity"></canvas>
          <div class="klabel">AMOUNT</div>
          <div class="kvalue" id="val-intensity">0%</div>
        </div>
        <div class="knob-col">
          <canvas class="kc" data-p="sharpness"></canvas>
          <div class="klabel">SHARPNESS</div>
          <div class="kvalue" id="val-sharpness">50%</div>
        </div>
        <div class="knob-col">
          <canvas class="kc" data-p="depth"></canvas>
          <div class="klabel">RANGE</div>
          <div class="kvalue" id="val-depth">-18.0 dB</div>
        </div>
        <div class="knob-col">
          <canvas class="kc" data-p="filter"></canvas>
          <div class="klabel">FREQUENCY</div>
          <div class="kvalue" id="val-filter">5.66 kHz</div>
        </div>
      </div>

      <!-- METERS -->
      <div class="meters-section">
        <div class="meter-label">GR / OUT</div>
        <div class="meter-bar-container">
          <div class="meter-track">
            <div class="meter-fill gr" id="gr-fill"></div>
          </div>
          <div class="meter-track">
            <div class="meter-fill out" id="out-fill"></div>
          </div>
        </div>
        <div class="meter-db" id="gr-db">0.0 dB</div>
      </div>

      <!-- SENSE MON -->
      <div class="monitor-section">
        <button class="mon-btn" id="monBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" stroke="#4a6878"/>
            <circle cx="12" cy="12" r="3" stroke="#4a6878"/>
          </svg>
        </button>
        <div class="mon-label" id="monLabel">LISTEN</div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-text">DEBESS — AIRWINDOWS</div>
  </div>

</div>

<script type="module" src="js/index.js"></script>
</body>
</html>
